<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GameNight</title>
  <meta name="theme-color" content="#0d0221">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GameNight">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <div class="crt" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="logo">GAME<span>NIGHT</span></h1>
    <div class="night-info" id="nightInfo"></div>
  </header>

  <main id="app"></main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box panel" id="modalBox"></div>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script src="games.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
